name: Release Pipeline & Cryptographic Audit

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, Audit & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Verify and Decode Official Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ERROR CRÍTICO: El secreto RELEASE_KEYSTORE_BASE64 no está configurado."
            echo "Prohibición estricta de silent fallback según gobernanza criptográfica del proyecto."
            exit 1
          fi
          mkdir -p ~/.android
          echo "$KEYSTORE_BASE64" | base64 --decode > ~/.android/gamma_release.jks
          if [ ! -s ~/.android/gamma_release.jks ]; then
            echo "::error::ERROR CRÍTICO: El keystore decodificado está vacío o corrupto."
            exit 1
          fi
          echo "Keystore oficial decodificado exitosamente."

      - name: Build Release APK
        env:
          KEYSTORE_FILE: /home/runner/.android/gamma_release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Cryptographic Audit of Release APK (Inviolable Gate)
        run: |
          EXPECTED_SHA256="2db8d51c88ad21c640a3bffb9fe04c50603e81182f8e1b7e54b3a568a580ffe7"
          EXPECTED_DN="CN=Gamma Mobile, OU=Release, O=Gamma, L=Asuncion, ST=Central, C=PY"
          
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner no encontrado en el entorno de Android."
            exit 1
          fi
          
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$RELEASE_APK" ]; then
            echo "::error::No se encontró el binario $RELEASE_APK."
            exit 1
          fi
          
          echo "Ejecutando auditoría criptográfica con $APKSIGNER..."
          SIGNER_OUTPUT=$($APKSIGNER verify --verbose --print-certs "$RELEASE_APK")
          echo "$SIGNER_OUTPUT"
          
          ACTUAL_SHA256=$(echo "$SIGNER_OUTPUT" | grep -i "SHA-256 digest:" | head -n 1 | awk '{print $NF}' | tr '[:upper:]' '[:lower:]')
          echo "SHA-256 Esperado: $EXPECTED_SHA256"
          echo "SHA-256 Obtenido: $ACTUAL_SHA256"
          
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::FALLO DE AUDITORÍA CRIPTOGRÁFICA: La huella SHA-256 no coincide con el certificado oficial ($EXPECTED_SHA256 vs $ACTUAL_SHA256)."
            exit 1
          fi
          
          echo "✅ Auditoría criptográfica superada: Certificado oficial verificado inmutablemente."

      - name: Determine Release Tag
        id: get_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION=$(cat VERSION | tr -d '[:space:]')
            TAG="v$VERSION"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: Gamma Mobile ${{ steps.get_tag.outputs.tag }}
          files: |
            app/build/outputs/apk/release/*.apk
          generate_release_notes: true
